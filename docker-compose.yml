version: '3.9'

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: reconx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  reconx:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis