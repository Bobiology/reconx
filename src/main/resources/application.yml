server:
    port: 8080

spring:
    application:
        name: recon-backend
    datasource:
        url: jdbc:h2:mem:recondb
        driverClassName: org.h2.Driver
        username: sa
        password:

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true

    h2:
        console:
            enabled: true
